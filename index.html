<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}@media (max-width:600px){body{padding:0!important}.frame{border-radius:0!important;box-shadow:none!important}}</style>
</head>
<body>
<title>合成小瑞瑞</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：整页一个 9:16 的游戏框居中，框外是深色桌面 */
:root {
  --desk: #1d3a2b;
  --field: #e8f8e2;
  --score: #ffffff;
  --stroke: #3a9459;
  --ink: #1f4d33;
  --cream: #f2fff0;
  --font-fun: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-num: "Lilita One", "Arial Rounded MT Bold", "Arial Black", sans-serif;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  background: var(--desk);
  color: var(--ink);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage { height: 100%; display: grid; place-items: center; container-type: size; }
.frame {
  position: relative;
  width: min(100cqw, 100cqh * 9 / 16);
  height: min(100cqh, 100cqw * 22 / 9);
  background: var(--field);
  border-radius: 14px;
  overflow: hidden;
  touch-action: none;
  container-type: inline-size;
  box-shadow: 0 10px 40px rgba(0,0,0,.45);
}
canvas { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; display: block; }
.score[hidden] { display: none; }
.score {
  position: absolute; left: 4.2cqw; top: 3.5cqw;
  font: 9cqw/1 var(--font-num);
  color: var(--score);
  -webkit-text-stroke: 1.1cqw var(--stroke);
  paint-order: stroke fill;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.mute {
  position: absolute; right: 3.5cqw; top: 3.5cqw;
  width: 9cqw; height: 9cqw; border-radius: 50%;
  border: .6cqw solid var(--stroke); background: var(--cream);
  color: var(--stroke); font: 4.2cqw/1 var(--font-fun);
  display: grid; place-items: center; cursor: pointer;
}
.pause { right: 14.5cqw; gap: 1.1cqw; grid-auto-flow: column; }
.pause i { display: block; width: 1.3cqw; height: 3.8cqw; border-radius: 1cqw; background: var(--stroke); }
.pause[hidden] { display: none; }
.pill {
  min-width: 34cqw; padding: 2.4cqw 5cqw; border-radius: 99px;
  border: .7cqw solid var(--stroke); background: var(--cream); color: var(--stroke);
  font: 5.4cqw/1 var(--font-fun); cursor: pointer;
  box-shadow: 0 1.2cqw 0 var(--stroke);
}
.pill:active { transform: translateY(1cqw); box-shadow: 0 .2cqw 0 var(--stroke); }
.pills { display: flex; gap: 4cqw; flex-wrap: wrap; justify-content: center; }
.mute:focus-visible, .play:focus-visible, .pill:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
.overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5cqw;
  background: rgba(16, 58, 36, .55);
  text-align: center;
}
.overlay[hidden] { display: none; }
.overlay h1, .overlay h2 {
  margin: 0;
  font-family: var(--font-fun); font-weight: 400;
  color: var(--score);
  -webkit-text-stroke: 1.4cqw var(--stroke);
  paint-order: stroke fill;
  text-wrap: balance;
  line-height: 1.1;
}
.overlay h1 { font-size: 14cqw; }
.overlay h2 { font-size: 13cqw; font-family: var(--font-num); }
.overlay .big { width: 40cqw; height: 40cqw; animation: bob 2.4s ease-in-out infinite; }
.overlay .final { font: 6cqw/1.2 var(--font-fun); color: var(--cream); }
.overlay .final b { font-family: var(--font-num); font-weight: 400; font-size: 11cqw; color: var(--score); -webkit-text-stroke: .9cqw var(--stroke); paint-order: stroke fill; display: block; }
.play {
  width: 24cqw; height: 24cqw; border: 0; padding: 0; background: none; cursor: pointer;
  animation: pulse 2s ease-in-out infinite;
}
.play img { width: 100%; height: 100%; display: block; }
.hint { font: 4.6cqw/1.3 var(--font-fun); color: var(--cream); }
@keyframes pulse { 0%,100% { transform: scale(.9); } 50% { transform: scale(.8); } }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-2cqw) rotate(6deg); } }
@media (prefers-reduced-motion: reduce) { .play, .overlay .big { animation: none; } }
.pill.small { min-width: 0; padding: 2cqw 4cqw; font-size: 4.6cqw; }
.who {
  display: flex; align-items: center; gap: 2.4cqw;
  padding: 1.4cqw 3.6cqw 1.4cqw 1.4cqw; border-radius: 99px;
  background: var(--cream); border: .6cqw solid var(--stroke); color: var(--stroke);
  font: 4.4cqw/1 var(--font-fun); cursor: pointer;
  position: absolute; left: 3.5cqw; top: 3.5cqw; max-width: 60cqw;
}
.who span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ava {
  flex: none; width: 8cqw; height: 8cqw; border-radius: 50%;
  background: #7fd67c center/cover no-repeat; color: #fff;
  display: grid; place-items: center; font: 4.2cqw/1 var(--font-fun);
  border: .4cqw solid #fff; overflow: hidden;
}
.ava.lg { width: 26cqw; height: 26cqw; font-size: 12cqw; border-width: 1cqw; box-shadow: 0 0 0 .7cqw var(--stroke); }
.rankline { font: 4.6cqw/1.3 var(--font-fun); color: var(--cream); min-height: 1.3em; }
.rankline b { color: #fff; font-family: var(--font-num); font-weight: 400; }
.sheet {
  position: absolute; inset: 0; z-index: 20;
  display: flex; align-items: flex-end; justify-content: center;
  background: rgba(16, 58, 36, .6);
}
.sheet[hidden] { display: none; }
.card {
  position: relative; width: 100%; max-height: 94%;
  display: flex; flex-direction: column; gap: 4cqw;
  background: var(--field); color: var(--ink);
  border-radius: 6cqw 6cqw 0 0; border-top: 1cqw solid var(--stroke);
  padding: 5cqw 5cqw 6cqw; overflow: hidden; gap: 3.4cqw;
  animation: rise .25s ease-out;
}
@keyframes rise { from { transform: translateY(30%); opacity: 0; } }
.card h3 { margin: 0; text-align: center; font: 7.4cqw/1.1 var(--font-fun); color: var(--stroke); letter-spacing: .04em; }
.x {
  position: absolute; right: 4cqw; top: 4cqw; width: 8cqw; height: 8cqw; border-radius: 50%;
  border: .5cqw solid var(--stroke); background: var(--cream); color: var(--stroke);
  font: 5cqw/1 var(--font-fun); cursor: pointer; display: grid; place-items: center;
}
.tabs { display: flex; gap: 2cqw; justify-content: center; }
.tabs button {
  flex: 1; padding: 2.2cqw 0; border-radius: 99px; cursor: pointer;
  border: .5cqw solid var(--stroke); background: var(--cream); color: var(--stroke);
  font: 4.6cqw/1 var(--font-fun);
}
.tabs button[aria-pressed="true"] { background: var(--stroke); color: #fff; }
.field { display: flex; flex-direction: column; gap: 1.4cqw; font: 4cqw/1.2 var(--font-fun); color: var(--ink); }
.field input {
  width: 100%; padding: 2.6cqw 3.4cqw; border-radius: 3cqw;
  border: .5cqw solid #a9d9b4; background: #fff; color: var(--ink);
  font-size: max(16px, 4.4cqw); font-family: inherit;
}
.field input:focus { outline: none; border-color: var(--stroke); }
.field small { color: #5f8a6d; font-size: 3.4cqw; }
.msg { min-height: 1.2em; text-align: center; font: 4cqw/1.3 var(--font-fun); color: #c0392b; }
.msg.ok { color: var(--stroke); }
.go { width: 100%; padding: 3cqw; font-size: 5.4cqw; background: var(--stroke); color: #fff; box-shadow: 0 1.2cqw 0 #23663a; }
.me-head { display: flex; flex-direction: column; align-items: center; gap: 2.4cqw; }
.me-head label { cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2cqw; font: 3.8cqw/1 var(--font-fun); color: var(--stroke); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3cqw; }
.stat { background: var(--cream); border: .5cqw solid #a9d9b4; border-radius: 3cqw; padding: 2.6cqw; text-align: center; font: 3.6cqw/1.3 var(--font-fun); color: #5f8a6d; }
.stat b { display: block; font: 7cqw/1.1 var(--font-num); color: var(--stroke); font-weight: 400; }
.row2 { display: flex; gap: 3cqw; }
.row2 > * { flex: 1; }
.live { display: flex; align-items: center; justify-content: center; gap: 1.6cqw; font: 3.4cqw/1 var(--font-fun); color: #5f8a6d; margin-top: -2cqw; }
.live i { width: 2cqw; height: 2cqw; border-radius: 50%; background: #bbb; }
.live.on i { background: #2ecc71; animation: blink 1.4s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.board { list-style: none; margin: 0; padding: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2cqw; min-height: 30cqw; }
.board li {
  display: grid; grid-template-columns: 8cqw 9cqw 1fr auto; align-items: center; gap: 2.4cqw;
  padding: 2cqw 3cqw; border-radius: 3.4cqw; background: var(--cream); border: .4cqw solid #cdebd3;
  font: 4.4cqw/1.2 var(--font-fun); color: var(--ink);
}
.board li.mine { border-color: var(--stroke); background: #d7f3d0; }
.board .no { font: 5.4cqw/1 var(--font-num); text-align: center; color: #8fb59a; }
.board li:nth-child(1) .no { color: #f1b500; }
.board li:nth-child(2) .no { color: #9aa7b0; }
.board li:nth-child(3) .no { color: #cd7f32; }
.board .ava { width: 9cqw; height: 9cqw; }
.board .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.board .sc { font: 5cqw/1 var(--font-num); color: var(--stroke); font-variant-numeric: tabular-nums; }
.empty { text-align: center; font: 4cqw/1.4 var(--font-fun); color: #5f8a6d; padding: 6cqw 0; }
.guest { align-self: center; border: 0; background: none; padding: 1cqw; cursor: pointer; font: 3.8cqw/1.3 var(--font-fun); color: #5f8a6d; text-decoration: underline; text-underline-offset: .6cqw; }
.card .tabs + .live { margin-top: -1cqw; }
.boardbox { display: flex; flex-direction: column; min-height: 0; }
.boardbox.full { flex: 1; overflow-y: auto; }
.boardbox:not(.full) { flex: none; }
.boardbox:not(.full) .board { overflow: visible; min-height: 0; }
.card #authForm { min-height: 0; }
.boardbox.full .board { overflow: visible; }
.mine-wrap { border-top: .5cqw dashed #a9d9b4; padding-top: 3cqw; }
.mine-wrap .board { min-height: 0; overflow: visible; }
.mine-wrap .board li .no { color: var(--stroke); }
.minelabel { font: 3.6cqw/1 var(--font-fun); color: #5f8a6d; margin-bottom: 1.6cqw; }
.guestrow { display: flex; align-items: center; justify-content: center; gap: 3cqw; font: 4cqw/1.3 var(--font-fun); color: var(--ink); }
.total { text-align: center; font: 3.6cqw/1.3 var(--font-fun); color: #5f8a6d; margin-top: -1cqw; }
#seeAll, #backTop { align-self: center; }
.mybar { font: 4cqw/1.3 var(--font-fun); text-align: center; color: var(--ink); }
.who[hidden] { display: none; }
/* 字体分工：标题、按钮、分数用可爱字体；说明、表单、玩家昵称等需要读清楚的地方用系统字体 */
:root { --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
.hint { font-family: var(--font-ui); font-weight: 500; letter-spacing: .02em; }
.overlay .final span { font-family: var(--font-ui); font-weight: 500; font-size: 4.4cqw; }
.field, .field input, .field small, .msg, .guest, .live, .mybar, .minelabel, .guestrow, .total,
.rankline, .stat, .empty, .tabs button, .who span, .me-head label, .board .nm, .ava { font-family: var(--font-ui); }
.field { font-weight: 600; font-size: 3.8cqw; }
.field small { font-weight: 400; line-height: 1.45; }
.field input { font-weight: 500; }
.tabs button { font-weight: 600; font-size: 4.2cqw; }
.msg, .guest, .rankline, .guestrow { font-weight: 500; }
.board .nm { font-weight: 600; font-size: 4.2cqw; }
.who span { font-weight: 600; font-size: 4cqw; }
.ava { font-weight: 600; }
.stat { font-weight: 500; }
/* 排行榜和表单的滚动条：细细一条绿色，只在滚动区域里出现 */
.boardbox.full, #authForm { scrollbar-width: thin; scrollbar-color: #9fd8a9 transparent; padding-right: 2cqw; margin-right: -2cqw; }
.boardbox.full::-webkit-scrollbar, #authForm::-webkit-scrollbar { width: 1.2cqw; }
.boardbox.full::-webkit-scrollbar-track, #authForm::-webkit-scrollbar-track { background: transparent; margin: 1cqw 0; }
.boardbox.full::-webkit-scrollbar-thumb, #authForm::-webkit-scrollbar-thumb { background: #9fd8a9; border-radius: 99px; }
.boardbox.full::-webkit-scrollbar-thumb:hover, #authForm::-webkit-scrollbar-thumb:hover { background: var(--stroke); }
.boardbox.full { -webkit-mask-image: linear-gradient(#000 0, #000 calc(100% - 6cqw), transparent); mask-image: linear-gradient(#000 0, #000 calc(100% - 6cqw), transparent); padding-bottom: 5cqw; }
.nowrap { white-space: nowrap; }
.stat b.txt { font: 600 5.6cqw/1.25 var(--font-ui); }

/* 图标统一用 SVG 画，不依赖字体里的符号 */
.mute svg { width: 5.4cqw; height: 5.4cqw; display: block; }
.x svg { width: 4.6cqw; height: 4.6cqw; display: block; }
.mute, .x { padding: 0; }
.mute { z-index: 5; }

/* 注册 / 登录面板紧凑排版：一屏放下，不用滑动 */
.card { padding: 4.4cqw 5cqw 4.6cqw; gap: 2.6cqw; max-height: 96%; }
.card h3 { font-size: 6.4cqw; }
.x { top: 3.6cqw; right: 3.6cqw; width: 7.6cqw; height: 7.6cqw; }
.tabs button { padding: 1.7cqw 0; font-size: 3.9cqw; }
#authForm { gap: 2.2cqw !important; padding-bottom: 1.8cqw; }
.field { gap: .8cqw; font-size: 3.5cqw; }
.field input { padding: 1.9cqw 3cqw; border-radius: 2.4cqw; }
.field small { font-size: 3cqw; line-height: 1.35; }
.msg { min-height: 1.3em; font-size: 3.5cqw; }
.go { padding: 2.4cqw; font-size: 4.8cqw; margin-top: .4cqw; }
.guest { font-size: 3.3cqw; padding: .4cqw; }

/* 合成路线图：点开始后先看一眼，再点任意处开局 */
.route { gap: 3.6cqw; background: rgba(12, 48, 30, .86); cursor: pointer; padding-inline: 5cqw; }
.route .rt { font-size: 10cqw; font-family: var(--font-fun); }
.chain { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2.6cqw .6cqw; max-width: 88cqw; }
.step { display: flex; flex-direction: column; align-items: center; gap: .9cqw; font: 600 2.9cqw/1 var(--font-ui); color: var(--cream); }
.step img { display: block; border-radius: 50%; }
.arr { width: 3.6cqw; height: 3.6cqw; color: #9fd8a9; flex: none; }
.arr.down { width: 6cqw; height: 6cqw; margin: -1cqw 0; transform: rotate(90deg); }
.final { display: flex; flex-direction: column; align-items: center; gap: 1.6cqw; font: 600 3.6cqw/1 var(--font-ui); color: #fff; }
.final img { width: 30cqw; height: 30cqw; border-radius: 50%; box-shadow: 0 0 0 1.2cqw rgba(159,216,169,.35), 0 0 8cqw rgba(159,216,169,.55); }
.route .rhint { font: 500 3.8cqw/1.4 var(--font-ui); color: var(--cream); opacity: .85; text-align: center; }
.route .tap { font: 4.6cqw/1 var(--font-fun); color: #fff; animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .route .tap { animation: none; } }
</style>

<div class="stage">
  <div class="frame" id="frame">
    <canvas id="cv"></canvas>
    <div class="score" id="score">0</div>
    <button class="mute pause" id="pauseBtn" type="button" aria-label="暂停" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="6" width="3.4" height="12" rx="1.7" fill="currentColor"/><rect x="13.6" y="6" width="3.4" height="12" rx="1.7" fill="currentColor"/></svg></button>
    <button class="mute" id="mute" type="button" aria-label="静音"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h3.5L12 5v14l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>

    <div class="overlay" id="startPanel">
      <img class="big" id="startBig" alt="">
      <h1 id="titleText"></h1>
      <button class="play" id="startBtn" type="button" aria-label="开始游戏"><img id="startImg" alt=""></button>
      <div class="hint" id="startHint"></div>
      <div class="pills">
        <button class="pill small" id="rankBtn1" type="button">排行榜</button>
        <button class="pill small" id="meBtn1" type="button">个人中心</button>
      </div>
    <button class="who" id="whoBtn" type="button"><span class="ava" id="whoAva"></span><span id="whoName">登录 / 注册</span></button>
    </div>

    <div class="overlay route" id="routePanel" hidden>
      <h2 class="rt" id="routeTitle"></h2>
      <div class="chain" id="chain"></div>
      <div class="tap" id="routeTap"></div>
    </div>

    <div class="overlay" id="pausePanel" hidden>
      <h1 id="pauseTitle"></h1>
      <button class="play" id="resumeBtn" type="button" aria-label="继续游戏"><img id="resumeImg" alt=""></button>
      <div class="hint" id="resumeHint"></div>
      <div class="pills">
        <button class="pill" id="restartBtn" type="button"></button>
        <button class="pill" id="homeBtn" type="button"></button>
        <button class="pill" id="rankBtn2" type="button">排行榜</button>
      </div>
    </div>

    <div class="overlay" id="overPanel" hidden>
      <h2 id="overText"></h2>
      <div class="final"><span id="finalLabel"></span><b id="finalScore">0</b></div>
      <button class="play" id="againBtn" type="button" aria-label="再来一局"><img id="againImg" alt=""></button>
      <div class="hint" id="againHint"></div>
      <div class="rankline" id="rankLine"></div>
      <div class="pills">
        <button class="pill small" id="rankBtn3" type="button">排行榜</button>
        <button class="pill small" id="loginBtn3" type="button">登录上榜</button>
      </div>
    </div>
    <div class="sheet" id="sheet" hidden>
      <div class="card" id="card" role="dialog" aria-modal="true">
        <button class="x" id="sheetClose" type="button" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
        <div id="sheetBody" style="display:contents"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

const { Engine, Bodies, Body, Composite, Events } = Matter;
const W = 720;
// 世界高度跟着屏幕比例走：长屏手机多出来的高度，六成给地面、四成给顶部，可玩区域大小不变
let H = 1280, GROUND_TOP = H - 127, SPAWN_Y = 120, LINE_Y = 220;
function fitWorld() {
  const r = frame.getBoundingClientRect();
  H = r.width > 0 ? Math.round(Math.min(1760, Math.max(1280, W * r.height / r.width))) : 1280;
  const extra = H - 1280;
  GROUND_TOP = H - 127 - Math.round(extra * 0.6);
  SPAWN_Y = 120 + Math.round(extra * 0.4);
  LINE_Y = 220 + Math.round(extra * 0.4);

/* ---------- 图片 ---------- */
function loadImg(src) { const i = new Image(); i.src = src; return i; }
const fruitImgs = CONFIG.levels.map((l) => loadImg(l.img));

fruitImgs.forEach((img, i) => {

/* ---------- 声音 ---------- */
let muted = false;

const audioEls = {};
for (const k in sounds) { const a = new Audio(sounds[k]); a.preload = "auto"; audioEls[k] = a; }
function play(name, vol = 1) {

/* ---------- 画布尺寸 ---------- */
let scale = 1;
function resize() {
  const r = frame.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.width * dpr * H / W);
  cv.style.height = (r.width * H / W) + "px";

}
new ResizeObserver(() => { if (typeof state !== "undefined" && state === "idle" && engine) { setupIdle(); } else resize(); }).observe(frame);

/* ---------- 物理 ---------- */
let engine, fruits, ghosts, fx, current, dropCount, score, shownScore, state, celebrate, lastDropAt;

function setupWorld() {
  fitWorld();
  resize();
  engine = Engine.create();
  engine.gravity.y = 1.5;
  engine.positionIterations = 10;
  engine.velocityIterations = 8;
  const opt = { isStatic: true, friction: 0.5, label: "ground" };
  Composite.add(engine.world, [
    Bodies.rectangle(W / 2, GROUND_TOP + 200, W * 2, 400, opt),
    Bodies.rectangle(WALL_IN - 200, H / 2, 400, H * 4, { ...opt, label: "wall" }),
    Bodies.rectangle(W - WALL_IN + 200, H / 2, 400, H * 4, { ...opt, label: "wall" }),
  ]);
  Events.on(engine, "collisionStart", onContacts);
  Events.on(engine, "collisionActive", onContacts);
}

function makeFruit(level, x, y, startScale = 1) {
  const r = CONFIG.levels[level].size / 2;
  const b = Bodies.circle(x, y, r, {
    restitution: 0.15, friction: 0.3, frictionStatic: 0.6, density: 0.001, label: "fruit",
  });
  b.level = level;
  b.landedAt = 0;
  b.dangerAt = 0;
  b.grow = startScale < 1 ? { t: 0 } : null;
  b.physScale = 1;
  if (startScale < 1) { Body.scale(b, startScale, startScale); b.physScale = startScale; }
  fruits.push(b);
  Composite.add(engine.world, b);
  return b;
}

function removeFruit(b) {
  b.gone = true;
  Composite.remove(engine.world, b);
  const i = fruits.indexOf(b);
  if (i >= 0) fruits.splice(i, 1);
}

function onContacts(ev) {
  if (state !== "play") return;
  const now = gt;
  for (const p of ev.pairs) {
    const a = p.bodyA, b = p.bodyB;
    for (const [s, o] of [[a, b], [b, a]]) {
      if (s.label === "fruit" && !s.landedAt && (o.label === "ground" || o.label === "fruit")) {
        s.landedAt = now;
        if (o.label === "ground" && ev.name === "collisionStart") play("desk", 0.6);
      }
    }
    if (a.label === "fruit" && b.label === "fruit" && a.level === b.level &&
        a.level < MAX && !a.gone && !b.gone && !a.merging && !b.merging) {
      merge(a, b);
    }
  }
}

function merge(a, b) {
  // 位置更低的那个是合成点，另一个飞过去
  const [low, high] = a.position.y > b.position.y ? [a, b] : [b, a];
  low.merging = high.merging = true;
  const level = low.level;
  const pos = { x: low.position.x, y: low.position.y };
  const g1 = { level, x: low.position.x, y: low.position.y, angle: low.angle, t: 0 };
  const g2 = { level, x: high.position.x, y: high.position.y, x0: high.position.x, y0: high.position.y, angle: high.angle, t: 0, tx: pos.x, ty: pos.y };
  ghosts.push(g1, g2);
  removeFruit(low); removeFruit(high);
  play("juice", 0.8);
  addScore(level + 1);
  setTimeout(() => {
    ghosts = ghosts.filter((g) => g !== g1 && g !== g2);
    if (state !== "play") return;
    ghosts = ghosts.filter((g) => g !== g1 && g !== g2);
    juiceBurst(level, pos.x, pos.y, CONFIG.levels[level].size);
    const nb = makeFruit(level + 1, pos.x, pos.y, 0.25);
    nb.landedAt = gt;
    Body.setVelocity(nb, { x: 0, y: 1.5 });
    if (level + 1 === MAX) startCelebrate();
  }, 100);
}

/* ---------- 分数 ---------- */
function addScore(n) { score += n; }

/* ---------- 特效 ---------- */
function juiceBurst(level, x, y, w) {
  const color = CONFIG.levels[level].juice;
  fx.push({ type: "blob", x, y, r: w / 2, color, t: 0, d: 0.45 });
  const n = 10 + Math.round(w / 30);
  for (let i = 0; i < n; i++) {
    const ang = Math.random() * Math.PI * 2;
    const dist = w / 2 + 20 + Math.random() * 70;
    fx.push({
      type: "drop", x, y, color,
      tx: x + Math.cos(ang) * dist, ty: y + Math.sin(ang) * dist,
      r: (3 + Math.random() * 7) * (0.6 + w / 300),
      t: 0, d: 0.35 + Math.random() * 0.35,
    });
  }
}

function startCelebrate() {
  play("cheer", 0.9);
  const ribbons = [];
  for (let i = 0; i < 90; i++) {
    ribbons.push({
      img: Math.floor(Math.random() * ribbonImgs.length),
      x: W / 2 + (Math.random() - 0.5) * 200, y: H * 0.38,
      vx: (Math.random() - 0.5) * 900, vy: -300 - Math.random() * 900,
      rot: Math.random() * 6, vr: (Math.random() - 0.5) * 20, s: 0.8 + Math.random() * 1.2,
    });
  }
  celebrate = { t: 0, ribbons };
}

/* ---------- 掉落控制 ---------- */
function nextLevel() {
  const seq = CONFIG.openingSequence;
  const lv = dropCount < seq.length ? seq[dropCount] : Math.floor(Math.random() * (CONFIG.randomMaxLevel + 1));
  dropCount++;
  return lv;
}
function spawnCurrent() {
  if (state !== "play") return;
  current = { level: nextLevel(), x: W / 2, t: 0, tween: null };
}
function clampX(x, level) {
  const r = CONFIG.levels[level].size / 2;
  return Math.max(WALL_IN + r, Math.min(W - WALL_IN - r, x));
}
function toWorldX(clientX) {
  const r = frame.getBoundingClientRect();
  return ((clientX - r.left) / r.width) * W;
}
let dragging = false;
frame.addEventListener("pointerdown", (e) => {
  if (state !== "play" || paused || !current || celebrate) return;
  dragging = true;
  try { frame.setPointerCapture(e.pointerId); } catch (_) {}
  current.tween = { from: current.x, to: clampX(toWorldX(e.clientX), current.level), t: 0 };
});
frame.addEventListener("pointermove", (e) => {
  if (!dragging || !current) return;
  current.tween = null;
  current.x = clampX(toWorldX(e.clientX), current.level);
});
function release() {
  if (!dragging) return;
  dragging = false;
  if (!current || state !== "play" || paused) return;
  if (current.tween) current.x = current.tween.to;
  const b = makeFruit(current.level, current.x, SPAWN_Y);
  Body.setVelocity(b, { x: 0, y: 12 });
  current = null;
  setTimeout(spawnCurrent, 500);
}
frame.addEventListener("pointerup", release);
frame.addEventListener("pointercancel", release);

/* ---------- 结束 ---------- */
function gameOver() {
  if (state !== "play") return;
  state = "ending";
  $("pauseBtn").hidden = true;
  current = null;
  const list = fruits.slice().reverse();
  list.forEach((b, i) => {
    setTimeout(() => {
      if (b.gone) return;
      juiceBurst(b.level, b.position.x, b.position.y, b.circleRadius * 2);
      addScore(b.level + 1);
      play("boom", 0.5);
      removeFruit(b);
    }, 100 * (i + 1));
  });
  setTimeout(() => {
    state = "over";
    $("pauseBtn").hidden = true;
    $("finalScore").textContent = score;
    $("overPanel").hidden = false;
    submitScore(score);
  }, Math.max(3000, 100 * list.length + 800));
}

/* ---------- 主循环 ---------- */
const easeBackOut = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
let lastT = performance.now(), acc = 0, gt = 1, paused = false;
function loop(now) {
  let dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (paused) dt = 0;
  gt += dt * 1000;
  if (!paused && (state === "play" || state === "ending")) {
    acc += dt * 1000;
    while (acc >= 1000 / 60) { Engine.update(engine, 1000 / 60); acc -= 1000 / 60; }
  }
  update(dt, gt);
  draw(gt);
  requestAnimationFrame(loop);
}

function update(dt, now) {
  // 新果子弹出动画（物理半径跟着长大）
  for (const b of fruits) {
    if (!b.grow) continue;
    b.grow.t += dt / 0.5;
    const s = Math.max(0.25, Math.min(1, easeBackOut(Math.min(1, b.grow.t))));
    if (Math.abs(s - b.physScale) > 0.001) { Body.scale(b, s / b.physScale, s / b.physScale); b.physScale = s; }
    if (b.grow.t >= 1) {
      if (b.physScale !== 1) { Body.scale(b, 1 / b.physScale, 1 / b.physScale); b.physScale = 1; }
      b.grow = null;
    }
  }
  if (current) {
    current.t = Math.min(1, current.t + dt / 0.5);
    if (current.tween) {
      current.tween.t = Math.min(1, current.tween.t + dt / 0.1);
      current.x = current.tween.from + (current.tween.to - current.tween.from) * current.tween.t;
    }
  }
  for (const g of ghosts) {
    g.t = Math.min(1, g.t + dt / 0.1);
    if (g.tx !== undefined) { g.x = g.x0 + (g.tx - g.x0) * g.t; g.y = g.y0 + (g.ty - g.y0) * g.t; }
  }
  for (const f of fx) f.t += dt;
  fx = fx.filter((f) => f.t < f.d);
  // 超线判定：落稳 3 秒后还在红线以上就闪红，然后结束
  if (state === "play") {
    for (const b of fruits) {
      if (!b.landedAt || b.grow) continue;
      const top = b.position.y - b.circleRadius;
      if (top < LINE_Y && now - b.landedAt > 3000 && !b.dangerAt) b.dangerAt = now;
      if (b.dangerAt && now - b.dangerAt > 1800) { gameOver(); break; }
    }
  }
  // 分数滚动
  if (shownScore < score) {
    shownScore = Math.min(score, shownScore + dt * Math.max(5, (score - shownScore) * 5));
    scoreEl.textContent = Math.floor(shownScore);
  }
  if (celebrate) {
    celebrate.t += dt;
    for (const r of celebrate.ribbons) { r.vy += 1400 * dt; r.vx *= 0.99; r.x += r.vx * dt; r.y += r.vy * dt; r.rot += r.vr * dt; }
    if (celebrate.t > 3.2) celebrate = null;
  }
}

function drawFruit(level, x, y, angle, s, red) {
  const size = CONFIG.levels[level].size * s;
  const img = red && redImgs[level] ? redImgs[level] : fruitImgs[level];
  if (!img.width && !img.naturalWidth) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.drawImage(img, -size / 2, -size / 2, size, size);
  ctx.restore();
}

function draw(now) {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);

  // 地面
  if (bottomImg.complete) ctx.drawImage(bottomImg, 0, GROUND_TOP, W, 127);
  if (H - GROUND_TOP > 127) { ctx.fillStyle = "#3a784b"; ctx.fillRect(0, GROUND_TOP + 126, W, H - GROUND_TOP - 126); }

  // 红线：最高的水果离线 100 以内时闪烁
  let highest = Infinity;
  for (const b of fruits) if (b.landedAt) highest = Math.min(highest, b.position.y - b.circleRadius);
  if (state !== "idle" && (highest - LINE_Y < 100 || state !== "play") && lineImg.complete) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(now / 95);
    ctx.drawImage(lineImg, (W - 711) / 2, LINE_Y - 4);
    ctx.globalAlpha = 1;
  }

  // 果汁底层
  for (const f of fx) {
    const p = f.t / f.d;
    if (f.type === "blob") {
      ctx.globalAlpha = 0.75 * (1 - p);
      ctx.fillStyle = f.color;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (0.6 + 0.6 * p), 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // 水果
  for (const g of ghosts) drawFruit(g.level, g.x, g.y, g.angle, 1, false);
  for (const b of fruits) {
    const s = b.grow ? Math.max(0, easeBackOut(Math.min(1, b.grow.t))) : 1;
    let red = false;
    if (b.dangerAt) {
      red = true;
      ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos((now - b.dangerAt) / 95));
    }
    drawFruit(b.level, b.position.x, b.position.y, b.angle, s, red);
    ctx.globalAlpha = 1;
  }
  if (current) drawFruit(current.level, current.x, SPAWN_Y, 0, Math.max(0, easeBackOut(current.t)), false);

  // 果汁颗粒
  for (const f of fx) {
    if (f.type !== "drop") continue;
    const p = f.t / f.d;
    const e = 1 - Math.pow(1 - p, 3);
    ctx.globalAlpha = 1 - p * 0.8;
    ctx.fillStyle = f.color;
    ctx.beginPath();
    ctx.arc(f.x + (f.tx - f.x) * e, f.y + (f.ty - f.y) * e, f.r * (1 - p * 0.6), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 合成大西瓜庆祝
  if (celebrate) {
    const t = celebrate.t;
    const fade = t < 2.6 ? 1 : Math.max(0, 1 - (t - 2.6) / 0.6);
    ctx.globalAlpha = 0.55 * fade;
    ctx.fillStyle = "#0b2a19";
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = fade;
    const cx = W / 2, cy = H * 0.4;
    const pop = Math.max(0, easeBackOut(Math.min(1, t / 0.6)));
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.8);
    const sun = 760 * pop; ctx.drawImage(sunImg, -sun / 2, -sun / 2, sun, sun);
    ctx.restore();
    const bub = 500 * pop; ctx.drawImage(bubbleImg, cx - bub / 2, cy - bub * 0.48, bub, bub * 500 / 523);
    drawFruit(MAX, cx, cy, Math.sin(t * 3) * 0.1, pop, false);
    for (const r of celebrate.ribbons) {
      const img = ribbonImgs[r.img];
      if (!img.complete) continue;
      ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
      ctx.drawImage(img, -img.width * r.s / 2, -img.height * r.s / 2, img.width * r.s, img.height * r.s);
      ctx.restore();
    }
    ctx.font = `76px ${getComputedStyle(document.documentElement).getPropertyValue("--font-fun")}`;
    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    ctx.lineWidth = 14; ctx.strokeStyle = "#3a9459";
    const ty = cy + 300;
    ctx.strokeText(CONFIG.bigWinText, cx, ty);
    ctx.fillStyle = "#ffffff"; ctx.fillText(CONFIG.bigWinText, cx, ty);
    ctx.globalAlpha = 1;
  }
}

/* ============================================================

const ONLINE = Object.assign({ url: "", anonKey: "", emailDomain: "xiaoruirui.game", boardSize: 50 }, window.XXR_CONFIG || {});
/* ============================================================ */

let sb = null, myId = null, me = null, liveOn = false, sheetView = null, lastResult = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function avaHTML(p, cls = "ava") {
  const url = p && p.avatar_url;
  const ch = esc(((p && p.nickname) || "?").trim().slice(0, 1));
  return url ? `<span class="${cls}" style="background-image:url('${esc(url)}')"></span>` : `<span class="${cls}">${ch}</span>`;
}
const toEmail = (u) => `${u.toLowerCase()}@${ONLINE.emailDomain}`;
function errText(e) {
  const m = (e && (e.message || e.error_description || String(e))) || "";
  if (/娘娘/.test(m)) return m;
  if (/Invalid login credentials/i.test(m)) return "账号或密码不对";
  if (/already registered|already exists/i.test(m)) return "已经有娘娘使用这个帐号啦";
  if (/Password should be/i.test(m)) return "密码至少 6 位";
  if (/Email not confirmed/i.test(m)) return "需要在 Supabase 里关闭邮箱验证（见部署说明）";
  if (/rate limit/i.test(m)) return "操作太频繁，稍等一会儿再试";
  if (/Failed to fetch|NetworkError/i.test(m)) return "网络连不上，检查一下网络";
  return m || "出错了，再试一次";
}

/* ---------- 账号状态 ---------- */
async function loadMe() {
  if (!sb || !myId) { me = null; renderWho(); return; }
  const { data } = await sb.from("profiles").select("id,username,nickname,avatar_url,best_score").eq("id", myId).maybeSingle();
  me = data || null;
  renderWho();
}
function renderWho() {
  const btn = $("whoBtn");
  btn.hidden = !configured;
  if (me) {
    $("whoAva").outerHTML = avaHTML(me).replace('class="ava"', 'class="ava" id="whoAva"');
    $("whoName").textContent = me.nickname;
    $("meBtn1").textContent = "个人中心";
    $("loginBtn3").textContent = "个人中心";
  } else {
    $("whoAva").outerHTML = '<span class="ava" id="whoAva">?</span>';
    $("whoName").textContent = "登录 / 注册";
    $("meBtn1").textContent = "登录";
    $("loginBtn3").textContent = "登录上榜";
  }
  if (sheetView === "me" && me) renderMe();
}
if (sb) {
  sb.auth.onAuthStateChange((ev, session) => {
    const id = session?.user?.id || null;
    if (ev === "INITIAL_SESSION" && !id && state === "idle" && !sheetView) setTimeout(() => openSheet("auth"), 0);
    if (id !== myId) { myId = id; setTimeout(loadMe, 0); }
  });
}

/* ---------- 弹出面板 ---------- */
function openSheet(view) {
  if (state === "play" && !paused) setPaused(true);
  sheetView = view;
  $("sheet").hidden = false;
  if (view === "auth") renderAuth("login");
  else if (view === "me") me ? renderMe() : renderAuth("login");
  else if (view === "rank") renderRank("top");
}
function closeSheet() { $("sheet").hidden = true; sheetView = null; }
$("sheetClose").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) closeSheet(); });
$("sheet").addEventListener("pointerdown", (e) => e.stopPropagation());

function notConfigured() {
  $("sheetBody").innerHTML = `<h3>还没连上服务器</h3><div class="empty">在网页代码里的 ONLINE 一栏填好 Supabase 的地址和 key 之后，排行榜和账号就能用了。</div>`;
}

/* 登录 / 注册 */
const TAKEN_USER = "已经有娘娘使用这个帐号啦";
const TAKEN_NICK = "已经有娘娘使用这个昵称啦";
async function checkNames(username, nickname) {
  const { data, error } = await sb.rpc("check_names", { p_username: username || null, p_nickname: nickname || null });
  if (error) throw error;
  return data || {};
}
function renderAuth(mode) {
  if (!sb) return notConfigured();
  const reg = mode === "reg";
  $("sheetBody").innerHTML = `
    <h3>${reg ? "注册账号" : "登录"}</h3>
    <div class="tabs">
      <button type="button" data-m="login" aria-pressed="${!reg}">登录</button>
      <button type="button" data-m="reg" aria-pressed="${reg}">注册</button>
    </div>
    <form id="authForm" style="display:flex;flex-direction:column;gap:3cqw;overflow-y:auto" novalidate>
      <label class="field">账号<input id="fUser" autocomplete="username" maxlength="16" required>
        ${reg ? "<small>3~16位字母、数字或下划线，登录时使用，确认后不能修改</small>" : ""}</label>
      ${reg ? `<label class="field">昵称<input id="fNick" maxlength="12" required><small>排行榜上显示的名字，可以随时修改</small></label>` : ""}
      <label class="field">密码<input id="fPass" type="password" autocomplete="${reg ? "new-password" : "current-password"}" required>
        ${reg ? "<small>至少6位，换浏览器后可用它登录，无法找回请自行牢记<span class='nowrap'>( ˘ ³˘)</span></small>" : ""}</label>
      ${reg ? `<label class="field">确认密码<input id="fPass2" type="password" autocomplete="new-password" required></label>` : ""}
      <div class="msg" id="fMsg"></div>
      <button class="pill go" id="fGo" type="submit">${reg ? "注册并登录" : "登录"}</button>
    </form>
    <button class="guest" id="guestBtn" type="button">游客模式（数据不会上传排行榜哦）</button>`;
  $("sheetBody").querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => renderAuth(b.dataset.m)));
  $("guestBtn").addEventListener("click", closeSheet);
  $("authForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const u = $("fUser").value.trim(), p = $("fPass").value, msg = $("fMsg");
    const nick = reg ? $("fNick").value.trim() : "";
    msg.className = "msg";
    if (!/^[A-Za-z0-9_]{3,16}$/.test(u)) return (msg.textContent = "账号要3~16位字母、数字或下划线");
    if (reg && (nick.length < 1 || nick.length > 12)) return (msg.textContent = "昵称要1~12个字");
    if (p.length < 6) return (msg.textContent = "密码至少6位");
    if (reg && p !== $("fPass2").value) return (msg.textContent = "两次输入的密码不一样");
    $("fGo").disabled = true; msg.textContent = reg ? "注册中…" : "登录中…"; msg.className = "msg ok";
    try {
      if (reg) {
        const c = await checkNames(u.toLowerCase(), nick);
        if (c.username_taken) throw new Error(TAKEN_USER);
        if (c.nickname_taken) throw new Error(TAKEN_NICK);
        const { data, error } = await sb.auth.signUp({ email: toEmail(u), password: p, options: { data: { username: u.toLowerCase(), nickname: nick } } });
        if (error) {
          if (/already registered|already exists/i.test(error.message)) throw new Error(TAKEN_USER);
          if (/Database error/i.test(error.message)) throw new Error(TAKEN_NICK);
          throw error;
        }
        if (!data.session) throw new Error("Email not confirmed");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email: toEmail(u), password: p });
        if (error) throw error;
      }
      const { data: s } = await sb.auth.getSession();
      myId = s.session?.user?.id || null;
      await loadMe();
      if (lastResult === "pending") submitScore(Number($("finalScore").textContent) || 0);
      sheetView = "me";
      renderMe();
    } catch (err) {
      msg.className = "msg"; msg.textContent = errText(err);
      $("fGo").disabled = false;
    }
  });
}

/* 个人中心 */
async function myRank(best) {
  if (!best) return null;
  const { count } = await sb.from("profiles").select("id", { count: "exact", head: true }).gt("best_score", best);
  return (count ?? 0) + 1;
}
function renderMe() {
  if (!sb) return notConfigured();
  if (!me) return renderAuth("login");
  $("sheetBody").innerHTML = `
    <h3>个人中心</h3>
    <div class="me-head">
      <label>${avaHTML(me, "ava lg")}<span>点头像更换</span>
        <input id="avaFile" type="file" accept="image/*" hidden></label>
    </div>
    <form id="nickForm" class="row2" style="align-items:flex-end" novalidate>
      <label class="field" style="flex:2">昵称<input id="nickIn" maxlength="12" value="${esc(me.nickname)}"></label>
      <button class="pill small" type="submit">保存</button>
    </form>
    <div class="msg" id="meMsg"></div>
    <div class="stats">
      <div class="stat"><b>${me.best_score || 0}</b>最高分</div>
      <div class="stat"><b id="meRank">–</b>当前排名</div>
    </div>
    <div class="mybar">账号：${esc(me.username)}</div>
    <div class="row2">
      <button class="pill small" id="toRank" type="button">看排行榜</button>
      <button class="pill small" id="logout" type="button">退出登录</button>
    </div>`;
  myRank(me.best_score).then((r) => { const el = $("meRank"); if (el) { el.textContent = r ? "第 " + r : "未上榜"; el.classList.toggle("txt", !r); } });
  $("toRank").addEventListener("click", () => { sheetView = "rank"; renderRank("top"); });
  $("logout").addEventListener("click", async () => { await sb.auth.signOut(); myId = null; me = null; renderWho(); renderAuth("login"); sheetView = "auth"; });
  $("nickForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const n = $("nickIn").value.trim(), msg = $("meMsg");
    if (n.length < 1 || n.length > 12) { msg.className = "msg"; msg.textContent = "昵称 1~12 个字"; return; }
    if (n === me.nickname) return;
    msg.className = "msg ok"; msg.textContent = "保存中…";
    const { error } = await sb.from("profiles").update({ nickname: n }).eq("id", myId);
    if (error) { msg.className = "msg"; msg.textContent = error.code === "23505" || /duplicate|unique/i.test(error.message) ? TAKEN_NICK : errText(error); return; }
    me.nickname = n; renderWho(); msg.className = "msg ok"; msg.textContent = "昵称已保存";
  });
  $("avaFile").addEventListener("change", async (e) => {
    const f = e.target.files && e.target.files[0], msg = $("meMsg");
    if (!f) return;
    msg.className = "msg ok"; msg.textContent = "上传中…";
    try {
      const blob = await squareAvatar(f);
      const path = `${myId}/avatar.webp`;
      const { error } = await sb.storage.from("avatars").upload(path, blob, { upsert: true, contentType: blob.type, cacheControl: "60" });
      if (error) throw error;
      const url = sb.storage.from("avatars").getPublicUrl(path).data.publicUrl + "?v=" + Date.now();
      const { error: e2 } = await sb.from("profiles").update({ avatar_url: url }).eq("id", myId);
      if (e2) throw e2;
      me.avatar_url = url; renderWho(); renderMe();
      $("meMsg").className = "msg ok"; $("meMsg").textContent = "头像已更新";
    } catch (err) { msg.className = "msg"; msg.textContent = "头像上传失败：" + errText(err); }
  });
}
async function squareAvatar(file) {
  const bmp = await createImageBitmap(file);
  const s = Math.min(bmp.width, bmp.height), size = 256;
  const c = document.createElement("canvas"); c.width = c.height = size;
  c.getContext("2d").drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, size, size);
  return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error("图片处理失败"))), "image/webp", 0.85));
}

/* 排行榜（实时）：本周榜 / 总榜，外面前 5，点「查看榜单」看前 500 */
let boardRows = [], boardTotal = 0, boardTimer = null, rankMode = "top", boardKind = "week";
function weekStart() {
  // 北京时间的本周一，和数据库里的 current_week() 一致
  const d = new Date(Date.now() + 8 * 3600e3);
  d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
  return d.toISOString().slice(0, 10);
}
async function fetchBoard() {
  const limit = rankMode === "full" ? 500 : 5;
  const totalQ = sb.from("profiles").select("id", { count: "exact", head: true });
  let rowsQ;
  if (boardKind === "week") {
    rowsQ = sb.from("weekly_scores").select("user_id,score,at,profiles(nickname,avatar_url)")
      .eq("week_start", weekStart()).order("score", { ascending: false }).order("at", { ascending: true }).limit(limit);
  } else {
    rowsQ = sb.from("profiles").select("id,nickname,avatar_url,best_score")
      .gt("best_score", 0).order("best_score", { ascending: false }).order("best_at", { ascending: true }).limit(limit);
  }
  const [rows, total] = await Promise.all([rowsQ, totalQ]);
  if (rows.error) throw rows.error;
  boardRows = (rows.data || []).map((r) => boardKind === "week"
    ? { id: r.user_id, nickname: (r.profiles && r.profiles.nickname) || "", avatar_url: r.profiles && r.profiles.avatar_url, score: r.score }
    : { id: r.id, nickname: r.nickname, avatar_url: r.avatar_url, score: r.best_score });
  boardTotal = total.count || 0;
}
function rowHTML(r, no, mine) {
  return `<li class="${mine ? "mine" : ""}"><span class="no">${no}</span>${avaHTML(r)}<span class="nm">${esc(r.nickname)}</span><span class="sc">${r.score}</span></li>`;
}
function boardHTML() {
  if (!boardRows.length) return `<div class="empty">${boardKind === "week" ? "本周还没有娘娘上榜，快来当第一名！" : "还没有娘娘上榜，快来当第一名！"}</div>`;
  return `<ol class="board">${boardRows.map((r, i) => rowHTML(r, i + 1, r.id === myId)).join("")}</ol>`;
}
async function myBoardEntry() {
  if (boardKind === "all") {
    const r = await myRank(me.best_score);
    return { score: me.best_score || 0, rank: r };
  }
  const wk = weekStart();
  const { data } = await sb.from("weekly_scores").select("score").eq("user_id", myId).eq("week_start", wk).maybeSingle();
  if (!data) return { score: 0, rank: null };
  const { count } = await sb.from("weekly_scores").select("user_id", { count: "exact", head: true }).eq("week_start", wk).gt("score", data.score);
  return { score: data.score, rank: (count ?? 0) + 1 };
}
async function renderRank(mode, kind) {
  if (!sb) return notConfigured();
  if (mode) rankMode = mode;
  if (kind) boardKind = kind;
  const full = rankMode === "full", week = boardKind === "week";
  $("sheetBody").innerHTML = `
    <h3>${full ? (week ? "本周前 500 名" : "总榜前 500 名") : "排行榜"}</h3>
    <div class="tabs">
      <button type="button" data-k="week" aria-pressed="${week}">本周榜</button>
      <button type="button" data-k="all" aria-pressed="${!week}">总榜</button>
    </div>
    <div class="live ${liveOn ? "on" : ""}" id="liveTag"><i></i><span>${liveOn ? "实时更新中" : "连接中…"}</span>${week ? " · 每周一 0 点刷新" : ""}</div>
    <div id="boardBox" class="${full ? "boardbox full" : "boardbox"}"><div class="empty">加载中…</div></div>
    <div class="mine-wrap" id="myBar"></div>
    <div class="total" id="totalTag"></div>
    ${full ? `<button class="pill small" id="backTop" type="button">返回</button>` : `<button class="pill small" id="seeAll" type="button">查看榜单</button>`}`;
  $("sheetBody").querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => renderRank(null, b.dataset.k)));
  if (full) $("backTop").addEventListener("click", () => renderRank("top"));
  else $("seeAll").addEventListener("click", () => renderRank("full"));
  try { await fetchBoard(); paintBoard(); } catch (err) { if ($("boardBox")) $("boardBox").innerHTML = `<div class="empty">${esc(errText(err))}</div>`; }
}
async function paintBoard() {
  const box = $("boardBox");
  if (!box || sheetView !== "rank") return;
  box.innerHTML = boardHTML();
  $("totalTag").textContent = `共 ${boardTotal} 位娘娘正在合成小瑞瑞……`;
  const bar = $("myBar");
  if (!me) {
    bar.innerHTML = `<div class="guestrow">游客模式，登录后成绩才能上榜 <button class="pill small" id="barLogin" type="button">登录</button></div>`;
    $("barLogin").addEventListener("click", () => { sheetView = "auth"; renderAuth("login"); });
    return;
  }
  const kindNow = boardKind;
  const m = await myBoardEntry();
  if (!$("myBar") || kindNow !== boardKind) return;
  bar.innerHTML = `<div class="minelabel">${boardKind === "week" ? "我的本周排名" : "我的总排名"}</div><ol class="board">${rowHTML({ ...me, score: m.score }, m.rank || "–", true)}</ol>`;
}
function setLive(on) {
  liveOn = on;
  const t = $("liveTag");
  if (t) { t.className = "live" + (on ? " on" : ""); t.querySelector("span").textContent = on ? "实时更新中" : "重新连接中…"; }
}
function boardChanged() {
  if (sheetView !== "rank") return;
  clearTimeout(boardTimer);
  boardTimer = setTimeout(async () => { try { await fetchBoard(); paintBoard(); } catch (_) {} }, 300);
}
if (sb) {
  sb.channel("board")
    .on("postgres_changes", { event: "*", schema: "public", table: "profiles" }, (p) => {
      if (p.new && p.new.id === myId && me) { Object.assign(me, p.new); renderWho(); }
      boardChanged();
    })
    .on("postgres_changes", { event: "*", schema: "public", table: "weekly_scores" }, boardChanged)
    .subscribe((status) => setLive(status === "SUBSCRIBED"));
}

/* 结算上传 */
async function submitScore(s) {
  const line = $("rankLine");
  if (!sb) { line.textContent = ""; return; }
  if (!me) {
    lastResult = "pending";
    line.innerHTML = `登录后这局成绩能上排行榜`;
    return;
  }
  lastResult = "sent";
  line.textContent = "成绩上传中…";
  const { data, error } = await sb.rpc("submit_score", { p_score: s });
  if (error) { line.textContent = "成绩没传上去：" + errText(error); return; }
  me.best_score = data.best;
  const head = data.new_record ? "新纪录！" : data.week_new ? "本周新纪录！" : "";
  const week = data.week_rank ? `本周第 <b>${data.week_rank}</b> 名 · ` : "";
  line.innerHTML = head + week + `总榜第 <b>${data.rank}</b> 名`;
  renderWho();
}

/* 按钮 */
$("whoBtn").addEventListener("click", () => openSheet(me ? "me" : "auth"));
$("rankBtn1").addEventListener("click", () => openSheet("rank"));
$("meBtn1").addEventListener("click", () => openSheet("me"));
$("rankBtn2").addEventListener("click", () => openSheet("rank"));
$("rankBtn3").addEventListener("click", () => openSheet("rank"));
$("loginBtn3").addEventListener("click", () => openSheet(me ? "me" : "auth"));
for (const id of ["whoBtn", "rankBtn1", "meBtn1", "rankBtn2", "rankBtn3", "loginBtn3"]) $(id).addEventListener("pointerdown", (e) => e.stopPropagation());
renderWho();

// 首屏：先摆几颗水果当背景
function setupIdle() {
  fruits = []; ghosts = []; fx = []; state = "idle"; score = 0; shownScore = 0;
  scoreEl.hidden = true;
  setupWorld();
  [[0, 150], [2, 260], [4, 420], [5, 600], [3, 330], [1, 520]].forEach(([lv, x], i) => makeFruit(lv, x, GROUND_TOP - 300 - i * 80));
  for (let i = 0; i < 240; i++) Engine.update(engine, 1000 / 60);
}
setupIdle();
requestAnimationFrame(loop);
